<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YojanaSetu — एक फोटो, सब योजनाएं</title>
    <meta name="description" content="Scan one document and discover every government scheme you qualify for. YojanaSetu — Ek Photo, Sab Yojanayein.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1E3A5F',
                        navyLight: '#2A4F7F',
                        saffron: '#FF9933',
                        saffronDark: '#E6851F',
                        cream: '#FFF8F0',
                        creamDark: '#F5EDE0',
                        ashoka: '#046A38',
                    },
                    fontFamily: {
                        hindi: ['Noto Sans Devanagari', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React + ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; background: #FFF8F0; overflow-x: hidden; }

        /* Scan line animation */
        @keyframes scanLine {
            0% { top: 0; }
            50% { top: calc(100% - 4px); }
            100% { top: 0; }
        }
        .scan-line {
            animation: scanLine 1.5s ease-in-out infinite;
        }

        /* Pulse animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .pulse-ring {
            animation: pulse-ring 1.5s ease-out infinite;
        }

        /* Waveform animation */
        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 100%; }
        }

        /* Confetti */
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            top: -10px;
            z-index: 100;
            pointer-events: none;
        }

        /* Slide transitions */
        .screen-enter { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .screen-exit { animation: slideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slideOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-30px) scale(0.97); }
        }

        /* Checkmark animation */
        @keyframes checkmark-draw {
            0% { stroke-dashoffset: 50; }
            100% { stroke-dashoffset: 0; }
        }
        @keyframes checkmark-circle {
            0% { stroke-dashoffset: 200; }
            100% { stroke-dashoffset: 0; }
        }

        /* Floating shapes */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-15px) rotate(5deg); }
            66% { transform: translateY(8px) rotate(-3deg); }
        }

        /* Gradient animation for landing */
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Card stagger */
        @keyframes card-pop {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Mic pulse */
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 153, 51, 0.5); }
            50% { box-shadow: 0 0 0 20px rgba(255, 153, 51, 0); }
        }

        /* Progress bar */
        @keyframes progress-fill {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* Typing indicator */
        @keyframes typing-dot {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

        // ─── Voice Q&A Sequence ──────────────────────────────────────
        const VOICE_QA = [
            { q: { hi: 'नमस्ते! आपका नाम क्या है?', en: 'Hello! What is your name?' },

        // ─── Confetti Component ──────────────────────────────────────
        function Confetti({ show }) {
            if (!show) return null;
            const colors = ['#FF9933', '#1E3A5F', '#046A38', '#FFD700', '#FF6B6B', '#4ECDC4', '#FFF'];
            const pieces = Array.from({ length: 50 }, (_, i) => ({
                id: i,
                left: Math.random() * 100,
                delay: Math.random() * 2,
                duration: 2 + Math.random() * 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: 6 + Math.random() * 8,
                shape: Math.random() > 0.5 ? 'circle' : 'rect',
            }));
            return (
                <div className="fixed inset-0 pointer-events-none z-50">
                    {pieces.map(p => (
                        <div key={p.id} className="confetti-piece"
                            style={{
                                left: `${p.left}%`,
                                width: p.shape === 'circle' ? p.size : p.size * 0.6,
                                height: p.size,
                                borderRadius: p.shape === 'circle' ? '50%' : '2px',
                                background: p.color,
                                animation: `confetti-fall ${p.duration}s ease-in ${p.delay}s forwards`,
                            }} />
                    ))}
                </div>
            );
        }

        // ─── Animated Checkmark ──────────────────────────────────────
        function AnimatedCheckmark({ show }) {
            if (!show) return null;
            return (
                <div className="flex justify-center my-6">
                    <svg width="80" height="80" viewBox="0 0 80 80">
                        <circle cx="40" cy="40" r="36" fill="none" stroke="#046A38" strokeWidth="3"
                            strokeDasharray="200" style={{ animation: 'checkmark-circle 0.6s ease forwards' }} />
                        <path d="M24 42 L34 52 L56 28" fill="none" stroke="#046A38" strokeWidth="4"
                            strokeLinecap="round" strokeLinejoin="round"
                            strokeDasharray="50" style={{ animation: 'checkmark-draw 0.4s ease 0.4s forwards', strokeDashoffset: 50 }} />
                    </svg>
                </div>
            );
        }

        // ─── Language Toggle ─────────────────────────────────────────
        function LangToggle({ lang, setLang }) {
            return (

        // ─── Floating Decorations ────────────────────────────────────

        // ═════════════════════════════════════════════════════════════
        // SCREEN 2: Scan / Upload
        // ═════════════════════════════════════════════════════════════
        function ScanScreen({ lang, onDone, onBack }) {
            const t = STRINGS[lang];
            const [phase, setPhase] = useState('upload'); // upload → scanning → extracting → done
            const fileRef = useRef(null);

            const handleFile = () => {
                setPhase('scanning');
                setTimeout(() => setPhase('extracting'), 1400);
                setTimeout(() => onDone(), 2600);
            };

            const handleViewfinder = () => {
                handleFile();
            };

            return (
                <div className="screen-enter min-h-screen flex flex-col items-center justify-center px-6 py-16 relative">
                    <BackButton onClick={onBack} lang={lang} />

                    {phase === 'upload' && (
                        <div className="flex flex-col items-center w-full max-w-sm screen-enter">
                            {/* Viewfinder */}
                            <div onClick={handleViewfinder}
                                className="w-full aspect-[3/4] bg-navy/5 rounded-3xl border-2 border-dashed border-navy/20 flex flex-col items-center justify-center relative overflow-hidden cursor-pointer group hover:border-saffron/50 transition-all duration-300 mb-6">
                                {/* Corner marks */}
                                <div className="absolute top-4 left-4 w-8 h-8 border-t-3 border-l-3 border-saffron rounded-tl-lg" />
                                <div className="absolute top-4 right-4 w-8 h-8 border-t-3 border-r-3 border-saffron rounded-tr-lg" />
                                <div className="absolute bottom-4 left-4 w-8 h-8 border-b-3 border-l-3 border-saffron rounded-bl-lg" />
                                <div className="absolute bottom-4 right-4 w-8 h-8 border-b-3 border-r-3 border-saffron rounded-br-lg" />

                                <div className="text-6xl mb-4 group-hover:scale-110 transition-transform duration-300">📄</div>
                                <p className="text-navy/60 text-center text-sm px-6 font-medium">
                                    {lang === 'hi' ? 'यहाँ टैप करें या नीचे बटन दबाएं' : 'Tap here or use the button below'}
                                </p>
                                <p className="text-navy/40 text-xs mt-2">
                                    {lang === 'hi' ? 'आधार, राशन कार्ड, आय प्रमाण पत्र...' : 'Aadhaar, Ration Card, Income Certificate...'}
                                </p>
                            </div>

                            <input type="file" ref={fileRef} className="hidden" accept="image/*" onChange={handleFile} />
                            <button onClick={() => fileRef.current?.click()}
                                className="w-full bg-gradient-to-r from-navy to-navyLight text-white font-bold py-4 rounded-2xl shadow-xl shadow-navy/20 hover:shadow-2xl transition-all duration-300 text-lg">
                                📷 {lang === 'hi' ? 'फोटो लें / अपलोड करें' : 'Take Photo / Upload'}
                            </button>
                        </div>
                    )}

                    {(phase === 'scanning' || phase === 'extracting') && (
                        <div className="flex flex-col items-center screen-enter">
                            {/* Scanning animation */}
                            <div className="w-64 h-80 bg-white rounded-2xl shadow-2xl relative overflow-hidden mb-8 border border-navy/5">
                                {/* Fake document content */}
                                <div className="p-5 space-y-3">
                                    <div className="h-5 bg-navy/8 rounded w-3/4" />
                                    <div className="h-4 bg-navy/6 rounded w-full" />
                                    <div className="h-4 bg-navy/6 rounded w-5/6" />
                                    <div className="flex gap-3 mt-4">
                                        <div className="w-16 h-20 bg-navy/8 rounded-lg" />
                                        <div className="flex-1 space-y-2">
                                            <div className="h-3 bg-navy/6 rounded" />
                                            <div className="h-3 bg-navy/6 rounded w-3/4" />
                                            <div className="h-3 bg-navy/6 rounded w-1/2" />
                                        </div>
                                    </div>
                                    <div className="h-4 bg-navy/6 rounded w-full mt-4" />
                                    <div className="h-4 bg-navy/6 rounded w-2/3" />
                                    <div className="h-8 bg-saffron/10 rounded mt-4" />
                                </div>
                                {/* Scan line */}
                                <div className="scan-line absolute left-0 w-full h-1 bg-gradient-to-r from-transparent via-saffron to-transparent shadow-lg shadow-saffron/50" />
                            </div>

                            <p className="text-xl font-bold text-navy mb-3">
                                {phase === 'scanning' ? t.scanning : t.extracting}
                            </p>

                            {/* Progress bar */}
                            <div className="w-64 h-2 bg-navy/10 rounded-full overflow-hidden">
                                <div className="h-full bg-gradient-to-r from-saffron to-saffronDark rounded-full"
                                    style={{ animation: 'progress-fill 2.5s ease-in-out forwards' }} />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ═════════════════════════════════════════════════════════════
        // SCREEN 3: Extracted Profile
        // ═════════════════════════════════════════════════════════════
        function ProfileScreen({ lang, onFindSchemes, onBack }) {
            const t = STRINGS[lang];
            const p = MOCK_PROFILE;
            const [editing, setEditing] = useState(false);

            const fields = [
                { label: t.name, value: p.name[lang], icon: '👤' },
                { label: t.age, value: p.age + (lang === 'hi' ? ' वर्ष' : ' years'), icon: '🎂' },
                { label: t.income, value: p.income[lang], icon: '💰' },
                { label: t.occupation, value: p.occupation[lang], icon: '🌾' },
                { label: t.land, value: p.land[lang], icon: '📐' },
                { label: t.category, value: p.category[lang], icon: '📋' },
            ];

            return (
                <div className="screen-enter min-h-screen flex flex-col items-center px-6 py-16">
                    <BackButton onClick={onBack} lang={lang} />

                    <AnimatedCheckmark show={true} />

                    <h2 className="text-2xl font-bold text-navy mb-2 text-center">{t.profileTitle}</h2>
                    <p className="text-navy/50 text-sm mb-6 text-center">
                        {lang === 'hi' ? 'आपके दस्तावेज़ से निकाली गई जानकारी' : 'Information extracted from your document'}
                    </p>

                    {/* Profile card */}
                    <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl shadow-navy/5 border border-navy/5 p-6 mb-6 relative overflow-hidden">
                        {/* Accent strip */}
                        <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-saffron via-white to-ashoka" />

                        <div className="space-y-4">
                            {fields.map((f, i) => (
                                <div key={i} className="flex items-center gap-3" style={{ animation: `card-pop 0.4s ease ${i * 0.08}s both` }}>
                                    <div className="w-10 h-10 rounded-xl bg-cream flex items-center justify-center text-lg shrink-0">{f.icon}</div>
                                    <div className="flex-1 min-w-0">
                                        <div className="text-xs text-navy/40 font-medium uppercase tracking-wider">{f.label}</div>
                                        {editing ? (
                                            <input className="w-full text-sm font-semibold text-navy border-b border-saffron/30 bg-transparent outline-none py-1" defaultValue={f.value} />
                                        ) : (
                                            <div className="text-sm font-semibold text-navy">{f.value}</div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Edit + Find buttons */}
                    <div className="w-full max-w-sm space-y-3">
                        <button onClick={() => setEditing(!editing)}
                            className="w-full py-3 rounded-xl border-2 border-navy/10 text-navy/70 font-semibold hover:border-saffron/40 hover:text-saffron transition-all duration-300 text-sm">
                            {editing ? (lang === 'hi' ? '✅ बदलाव सेव करें' : '✅ Save Changes') : t.editBtn}
                        </button>
                        <button onClick={onFindSchemes}
                            className="w-full bg-gradient-to-r from-saffron to-saffronDark text-white font-bold py-4 rounded-2xl shadow-xl shadow-saffron/25 hover:shadow-2xl hover:shadow-saffron/40 hover:-translate-y-0.5 transition-all duration-300 text-lg relative overflow-hidden group">
                            <span className="relative z-10">{t.findSchemes}</span>
                            <div className="absolute inset-0 bg-white/10 translate-x-full group-hover:translate-x-0 transition-transform duration-500" />
                        </button>
                    </div>
                </div>
            );
        }

        // ═════════════════════════════════════════════════════════════
        // SCREEN 4: Results
        // ═════════════════════════════════════════════════════════════
        function ResultsScreen({ lang, onBack, onStartOver }) {
            const t = STRINGS[lang];
            const [showConfetti, setShowConfetti] = useState(true);
            const [tooltip, setTooltip] = useState(null);

            useEffect(() => {
                const timer = setTimeout(() => setShowConfetti(false), 4000);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div className="screen-enter min-h-screen px-4 py-16 relative">
                    <BackButton onClick={onBack} lang={lang} />
                    <Confetti show={showConfetti} />

                    <div className="max-w-lg mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8 pt-4">
                            <div className="inline-flex items-center gap-2 bg-ashoka/10 text-ashoka px-4 py-1.5 rounded-full text-sm font-bold mb-3">
                                <span>🎉</span>
                                <span>{MOCK_SCHEMES.length} {lang === 'hi' ? 'योजनाएं मिलीं!' : 'Schemes Found!'}</span>
                            </div>
                            <h2 className="text-2xl font-bold text-navy">{t.resultsTitle}</h2>
                            <p className="text-navy/50 text-sm mt-1">{t.resultsSubtext}</p>
                        </div>

                        {/* Scheme cards */}
                        <div className="space-y-4 pb-8">
                            {MOCK_SCHEMES.map((s, i) => (
                                <div key={i} className="bg-white rounded-2xl shadow-lg shadow-navy/5 border border-navy/5 overflow-hidden relative group hover:shadow-xl transition-all duration-300"
                                    style={{ animation: `card-pop 0.5s ease ${i * 0.12}s both` }}>
                                    {/* Top accent */}
                                    <div className={`h-1.5 bg-gradient-to-r ${s.color}`} />

                                    <div className="p-5">
                                        {/* Title + Match */}
                                        <div className="flex items-start justify-between mb-3">
                                            <div className="flex items-center gap-3">
                                                <div className="text-2xl">{s.icon}</div>
                                                <h3 className="font-bold text-navy text-base leading-tight">{s.name[lang]}</h3>
                                            </div>
                                            <div className="shrink-0 ml-2">
                                                <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${s.color} flex items-center justify-center shadow-md`}>
                                                    <span className="text-white text-xs font-black">{s.match}%</span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Benefit */}
                                        <div className="bg-cream rounded-xl p-3 mb-3">
                                            <div className="text-xs text-navy/40 font-semibold uppercase tracking-wider mb-1">{t.benefit}</div>
                                            <div className="text-sm font-bold text-navy">{s.benefit[lang]}</div>
                                        </div>

                                        {/* Eligibility reason */}
                                        <div className="flex items-start gap-2 mb-3">
                                            <span className="text-ashoka text-sm mt-0.5">✓</span>
                                            <p className="text-sm text-navy/70">{s.reason[lang]}</p>
                                        </div>

                                        {/* Documents */}
                                        <div className="mb-4">
                                            <div className="text-xs text-navy/40 font-semibold uppercase tracking-wider mb-1.5">{t.docsNeeded}</div>
                                            <div className="flex flex-wrap gap-1.5">
                                                {s.docs[lang].split(', ').map((doc, di) => (
                                                    <span key={di} className="text-xs bg-navy/5 text-navy/60 px-2.5 py-1 rounded-lg font-medium">{doc}</span>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Apply button */}
                                        <div className="relative">
                                            <button
                                                onMouseEnter={() => setTooltip(i)}
                                                onMouseLeave={() => setTooltip(null)}
                                                className="w-full py-3 rounded-xl bg-navy/5 text-navy/50 font-semibold text-sm cursor-not-allowed hover:bg-navy/10 transition-all duration-200 flex items-center justify-center gap-2">
                                                <span>🔗</span> {t.applyBtn}
                                            </button>
                                            {tooltip === i && (
                                                <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-navy text-white text-xs rounded-lg px-3 py-2 whitespace-nowrap shadow-xl z-10">
                                                    {t.applyTooltip}
                                                    <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-1 w-2 h-2 bg-navy rotate-45" />
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Start over */}
                        <div className="text-center pb-8">
                            <button onClick={onStartOver}
                                className="bg-white border-2 border-navy/10 text-navy font-semibold py-3 px-8 rounded-2xl hover:border-saffron/40 hover:text-saffron transition-all duration-300">
                                {t.startOver}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ═════════════════════════════════════════════════════════════
        // SCREEN 5: Voice Mode
        // ═════════════════════════════════════════════════════════════
        function VoiceScreen({ lang, onDone, onBack }) {
            const t = STRINGS[lang];
            const [qaIndex, setQaIndex] = useState(0);
            const [messages, setMessages] = useState([]);
            const [listening, setListening] = useState(false);
            const [showWave, setShowWave] = useState(false);
            const chatRef = useRef(null);

            useEffect(() => {
                // Start conversation
                const timer = setTimeout(() => {
                    addMessage('bot', VOICE_QA[0].q[lang]);
                }, 800);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (chatRef.current) {
                    chatRef.current.scrollTop = chatRef.current.scrollHeight;
                }
            }, [messages]);

            const addMessage = (sender, text) => {
                setMessages(prev => [...prev, { sender, text, id: Date.now() }]);
            };

            const handleMicClick = () => {
                if (listening) return;
                const currentQA = VOICE_QA[qaIndex];
                if (!currentQA || !currentQA.a) return;

                setListening(true);
                setShowWave(true);

                // Simulate user speaking
                setTimeout(() => {
                    setListening(false);
                    setShowWave(false);
                    addMessage('user', currentQA.a[lang]);

                    const nextIndex = qaIndex + 1;
                    setQaIndex(nextIndex);

                    // Bot responds with next question
                    setTimeout(() => {
                        if (nextIndex < VOICE_QA.length) {
                            addMessage('bot', VOICE_QA[nextIndex].q[lang]);
                            if (!VOICE_QA[nextIndex].a) {
                                // Last question — transition to results
                                setTimeout(() => onDone(), 2000);
                            }
                        }
                    }, 600);
                }, 2000);
            };

            return (
                <div className="screen-enter min-h-screen flex flex-col relative">
                    <BackButton onClick={onBack} lang={lang} />

                    {/* Header */}
                    <div className="text-center pt-16 pb-4 px-6">
                        <h2 className="text-2xl font-bold text-navy">{t.voiceTitle}</h2>
                        <p className="text-navy/50 text-sm mt-1">{t.voiceSubtext}</p>
                    </div>

                    {/* Chat area */}
                    <div ref={chatRef} className="flex-1 overflow-y-auto px-4 pb-40 scrollbar-hide">
                        <div className="max-w-lg mx-auto space-y-3">
                            {messages.map((msg, i) => (
                                <div key={msg.id}
                                    className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                                    style={{ animation: `card-pop 0.3s ease both` }}>
                                    <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm ${
                                        msg.sender === 'user'
                                            ? 'bg-gradient-to-r from-saffron to-saffronDark text-white rounded-br-md'
                                            : 'bg-white border border-navy/10 text-navy shadow-sm rounded-bl-md'
                                    }`}>
                                        {msg.sender === 'bot' && <span className="text-xs font-bold text-saffron block mb-1">YojanaSetu</span>}
                                        {msg.text}
                                    </div>
                                </div>
                            ))}

                            {/* Typing indicator */}
                            {listening && (
                                <div className="flex justify-start" style={{ animation: 'card-pop 0.3s ease both' }}>
                                    <div className="bg-white border border-navy/10 rounded-2xl rounded-bl-md px-4 py-3 shadow-sm">
                                        <div className="flex gap-1">
                                            {[0, 1, 2].map(j => (
                                                <div key={j} className="w-2 h-2 bg-navy/30 rounded-full"
                                                    style={{ animation: `typing-dot 1s ease ${j * 0.15}s infinite` }} />
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Mic button area */}
                    <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-cream via-cream to-transparent pt-12 pb-8 flex flex-col items-center">
                        {/* Waveform */}
                        {showWave && (
                            <div className="flex items-center justify-center gap-1 mb-4 h-8">
                                {Array.from({ length: 20 }, (_, i) => (
                                    <div key={i} className="w-1 bg-saffron rounded-full"
                                        style={{
                                            height: '8px',
                                            animation: `wave 0.8s ease ${i * 0.05}s infinite`,
                                            maxHeight: '32px',
                                        }} />
                                ))}
                            </div>
                        )}

                        {/* Mic button */}
                        <button onClick={handleMicClick}
                            disabled={listening || qaIndex >= VOICE_QA.length}
                            className={`w-20 h-20 rounded-full flex items-center justify-center text-3xl transition-all duration-300 shadow-xl ${
                                listening
                                    ? 'bg-red-500 text-white shadow-red-500/30'
                                    : qaIndex >= VOICE_QA.length
                                        ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                        : 'bg-gradient-to-br from-saffron to-saffronDark text-white shadow-saffron/30 hover:scale-105 active:scale-95'
                            }`}
                            style={listening ? { animation: 'mic-pulse 1s ease infinite' } : {}}>
                            🎙️
                        </button>
                        <p className="text-xs text-navy/40 mt-3">
                            {listening
                                ? (lang === 'hi' ? 'सुन रहे हैं...' : 'Listening...')
                                : (lang === 'hi' ? 'माइक दबाएं' : 'Press mic to speak')}
                        </p>
                    </div>
                </div>
            );
        }

        // ═════════════════════════════════════════════════════════════
        // APP (Router)
        // ═════════════════════════════════════════════════════════════
        function App() {
            const [screen, setScreen] = useState('landing');
            const [lang, setLang] = useState('hi');
            const [animKey, setAnimKey] = useState(0);

            const navigate = useCallback((target) => {
                setAnimKey(k => k + 1);
                // Small delay for exit animation
                setTimeout(() => setScreen(target), 50);
            }, []);

            return (
                <div className="min-h-screen bg-cream relative overflow-x-hidden">
                    <LangToggle lang={lang} setLang={setLang} />
                    <FloatingShapes />

                    <div key={animKey}>
                        {screen === 'landing' && (
                            <LandingScreen lang={lang}
                                onScan={() => navigate('scan')}
                                onVoice={() => navigate('voice')} />
                        )}
                        {screen === 'scan' && (
                            <ScanScreen lang={lang}
                                onDone={() => navigate('profile')}
                                onBack={() => navigate('landing')} />
                        )}
                        {screen === 'profile' && (
                            <ProfileScreen lang={lang}
                                onFindSchemes={() => navigate('results')}
                                onBack={() => navigate('scan')} />
                        )}
                        {screen === 'results' && (
                            <ResultsScreen lang={lang}
                                onBack={() => navigate('profile')}
                                onStartOver={() => navigate('landing')} />
                        )}
                        {screen === 'voice' && (
                            <VoiceScreen lang={lang}
                                onDone={() => navigate('results')}
                                onBack={() => navigate('landing')} />
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
